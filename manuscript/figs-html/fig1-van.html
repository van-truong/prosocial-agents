<!--
Suggested LaTeX caption (replaces the fig:placeholder caption in content.tex):

\textbf{Overview.}
\textbf{(A)} Agents face a social dilemma: individually rational defection (red) forfeits the
surplus of mutual cooperation (green). We study two orthogonal levers. \emph{Contracts} act on
the game from outside, reshaping payoffs and actions (e.g., a fine pinned to defection);
\emph{``we''-frames} act from inside, shifting each agent's objective from ``what should I do?''
to ``what should we do?''. Either lever alone, or both together, can move play from mutual
defection toward mutual cooperation (arrow). Contracts, however, are inherently \emph{incomplete}:
unobservable or unforeseen contingencies (red ``?'') escape their reach, whereas frames travel
with the agent's reasoning and remain robust as the environment changes.
\textbf{(B)} Two testbeds. \emph{TableGames}: one-shot 2$\times$2 games (Prisoner's Dilemma,
Stag Hunt) expanded to 4$\times$4 with an unobservable effort dimension, so enforcers can verify
the move but not the effort (moral hazard); the star marks the welfare-optimal outcome.
\emph{GovSimContract}: five agents repeatedly harvest a shared fishery that regenerates at rate
$\rho$ over a 12-month horizon, negotiating and voting on a rule each month.
\textbf{(C)} Three contract regimes: no contract; natural-language contracts (common knowledge,
unenforced); and code contracts, compiled by a fixed coder LLM into Python that clips actions,
fines, and transfers automatically. The negotiation phase is identical; only what the agreed
text becomes differs.
-->
